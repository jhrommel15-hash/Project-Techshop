    <!-- Admin Dashboard Visibility -->
    <script>
      fetch("api/admin-status.php", {
        credentials: "same-origin"
      })
        .then((response) => response.json())
        .then((result) => {
          const adminItem = document.getElementById(
            "admin-dashboard-item"
          );

          if (adminItem && result.isAdmin === true) {
            adminItem.style.display = "list-item";
          }
        })
        .catch((error) => {
          console.error("Unable to check admin status:", error);
        });
    </script>
